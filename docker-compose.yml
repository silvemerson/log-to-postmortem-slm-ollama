services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - ai-local
    # --- GPU opcional (NVIDIA) ---
    # Descomente o bloco abaixo se tiver GPU NVIDIA + nvidia-container-toolkit instalado.
    # A demo da palestra roda em CPU, mas com GPU a inferência fica bem mais rápida.
    #
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - open_webui_data:/app/backend/data
    depends_on:
      - ollama
    networks:
      - ai-local

volumes:
  ollama_models:
  open_webui_data:

networks:
  ai-local:
    driver: bridge
